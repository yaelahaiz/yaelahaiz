<svg width="1200" height="220" viewBox="0 0 1200 220" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">GitHub contribution snake placeholder</title>
  <desc id="desc">This file is replaced automatically by the Generate Snake GitHub Action.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#020617"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="line" x1="120" y1="115" x2="1080" y2="115" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00D4FF"/>
      <stop offset="0.55" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1200" height="220" fill="url(#bg)"/>
  <path d="M120 118 C210 52 305 180 405 116 C516 45 606 178 720 114 C822 57 915 152 1080 92" stroke="url(#line)" stroke-width="10" stroke-linecap="round" filter="url(#glow)"/>
  <circle cx="1080" cy="92" r="16" fill="#00D4FF" filter="url(#glow)"/>
  <circle cx="1086" cy="87" r="3" fill="#020617"/>
  <text x="600" y="180" text-anchor="middle" fill="#94A3B8" font-family="Consolas, monospace" font-size="18">
    Contribution snake will update automatically after the workflow runs
  </text>
</svg>
